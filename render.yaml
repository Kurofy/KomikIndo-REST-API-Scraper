# Render.com Blueprint Specification
services:
  - type: web
    name: komikindo-api
    runtime: docker
    plan: free
    region: singapore # Closest region to Indonesian CDNs & low latency
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: BASE_URL
        value: https://komikindo.ch
      - key: ENVIRONMENT
        value: production
      - key: REQUEST_TIMEOUT
        value: 15
      - key: HOMEPAGE_CACHE_TTL
        value: 600
      - key: LATEST_CACHE_TTL
        value: 600
      - key: COMIC_DETAIL_CACHE_TTL
        value: 1800
      - key: SEARCH_CACHE_TTL
        value: 1800
      - key: GENRES_CACHE_TTL
        value: 86400
      - key: CHAPTER_CACHE_TTL
        value: 86400
